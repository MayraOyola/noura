
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checks:

    runs-on: ubuntu-latest

    steps: 
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      
    - name: Install Python
      run: uv python install
        
    - name: Run tests
      run: uv run pytest
        
    - name: Lint
      run: uv run ruff check

    - name: Type check
      run: uv run mypy src
